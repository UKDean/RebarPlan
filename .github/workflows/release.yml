name: Build Windows installer

# A tag like v1.0.0 builds the installer and publishes a GitHub release.
# Running the workflow by hand builds it and keeps it as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node --test tests/

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RebarPlan ${{ github.ref_name }}
          releaseBody: |
            Bar bending schedule and rebar cutting optimiser for Windows. Arabic, English and Simplified Chinese.
            Download **RebarPlan_…_x64-setup.exe** and run it. Windows may show a SmartScreen notice because the installer is not code-signed yet: choose “More info” → “Run anyway”.
          releaseDraft: false

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: RebarPlan-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
