name: Build installers

# A tag like v1.0.0 builds the Windows and macOS installers and publishes a
# GitHub release. Running the workflow by hand builds them and keeps them as
# workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            rust-targets: ""
            artifact: RebarPlan-Windows
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifact: RebarPlan-macOS
            files: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node --test "tests/*.test.mjs"

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RebarPlan ${{ github.ref_name }}
          args: ${{ matrix.args }}
          releaseBody: |
            Bar bending schedule and rebar cutting optimiser. Arabic, English and Simplified Chinese.
            **Windows:** download `RebarPlan_…_x64-setup.exe` and run it. SmartScreen may warn because the installer is not code-signed yet: choose “More info” → “Run anyway”.
            **macOS:** download `RebarPlan_…_universal.dmg`, drag RebarPlan to Applications, then right-click it and choose “Open” the first time.
          releaseDraft: false

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
