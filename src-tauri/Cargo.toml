[package]
name = "rebarplan"
version = "1.0.0"
description = "Bar bending schedule and rebar cutting optimiser"
authors = ["Omar Mashharawi <info@mashharawi.com>"]
license = "MIT"
repository = "https://github.com/UKDean/RebarPlan"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
